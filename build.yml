name: Сборка справочника
on:
  push:
    paths: ['source/**', 'spravochnik_tool/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python spravochnik_tool/build.py source --out index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Обновление справочника
          file_pattern: index.html index.snapshot.json
